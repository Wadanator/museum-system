[platformio]
default_envs = relay_bridge, motor_bridge
src_dir = ../devices
lib_dir = ../libraries

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
lib_deps = knolleary/PubSubClient@2.8
monitor_speed = 115200
build_flags = -Wall

[env:relay_bridge]
board = esp32-s3-devkitc-1
build_src_filter = -<*> +<lan/ArduinoIDE/esp32_mqtt_controller_RELAY_ESPNOW/>

[env:motor_bridge]
board = esp32dev
build_src_filter = -<*> +<wifi/ArduinoIDE/esp32_mqtt_controller_MOTORS_ESPNOW/>

[env:relay_legacy]
extends = env:relay_bridge
build_flags = ${env.build_flags} -DESPNOW_ENABLED=0

[env:motor_legacy]
extends = env:motor_bridge
build_flags = ${env.build_flags} -DESPNOW_ENABLED=0
