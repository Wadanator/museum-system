[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
pythonpath = .
addopts =
    -ra
    --strict-markers
markers =
    quick: fast offline tests safe for routine development
    integration: requires a running dashboard/service, network, or external process
    manual: direct-run diagnostic script, not part of the quick pytest suite
    slow: stress/load/long-running test
    hardware: requires real GPIO/audio/video/MQTT hardware
